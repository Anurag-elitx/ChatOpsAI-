apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatops-api-deployment
  labels:
    app: chatops-api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chatops-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: chatops-api
        tier: backend
    spec:
      containers:
        - name: chatops-api
          image: your-registry/chatops-api:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          envFrom:
            - secretRef:
                name: chatops-secrets
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
